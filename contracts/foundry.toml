[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Cosmos EVM chain id and Sepolia are configured per-network in deploy scripts / .env
fs_permissions = [
  { access = "read", path = "./test/fixtures" },
  { access = "read", path = "./deployments/params" },
  { access = "write", path = "./deployments/out" },
]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64

[rpc_endpoints]
blockid_chain = "${BLOCKID_CHAIN_RPC}"
sepolia = "${SEPOLIA_RPC_URL}"
# Ethereum Hoodi testnet (chain id 560048), public RPC — no API key needed
hoodi = "https://ethereum-hoodi-rpc.publicnode.com"
