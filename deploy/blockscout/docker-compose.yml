# Blockscout EVM explorer for BlockID Chain (EVM chain id 262626) at https://scan.blockid.au
# Run: docker compose --env-file /opt/blockid/blockscout.env up -d
name: blockscout

services:
  bs-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: blockscout
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: ${BS_DB_PASSWORD}
    volumes: ["/mnt/app-data/blockscout-db:/var/lib/postgresql/data"]
    command: postgres -c max_connections=200

  bs-redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    image: ghcr.io/blockscout/blockscout:latest
    restart: unless-stopped
    depends_on: [bs-db, bs-redis]
    command: sh -c 'bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()" && bin/blockscout start'
    networks: [default, chain]
    environment:
      ETHEREUM_JSONRPC_VARIANT: geth
      ETHEREUM_JSONRPC_HTTP_URL: http://evmd:8545
      ETHEREUM_JSONRPC_TRACE_URL: http://evmd:8545
      ETHEREUM_JSONRPC_WS_URL: ws://evmd:8546
      CHAIN_ID: "262626"
      COIN: BLKD
      COIN_NAME: BlockID
      NETWORK: BlockID Chain
      SUBNETWORK: Testnet
      DATABASE_URL: postgresql://blockscout:${BS_DB_PASSWORD}@bs-db:5432/blockscout
      ACCOUNT_REDIS_URL: redis://bs-redis:6379
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ECTO_USE_SSL: "false"
      PORT: "4000"
      INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "true"
      INDEXER_DISABLE_EXCHANGE_RATES_FETCHER: "true"
      DISABLE_EXCHANGE_RATES: "true"
      MICROSERVICE_SC_VERIFIER_ENABLED: "false"
      MICROSERVICE_VISUALIZE_SOL2UML_ENABLED: "false"
      MICROSERVICE_SIG_PROVIDER_ENABLED: "false"
      API_V2_ENABLED: "true"
      POOL_SIZE: "30"
      POOL_SIZE_API: "10"
      ECTO_POOL_SIZE: "30"
    ports: ["127.0.0.1:8200:4000"]

  frontend:
    image: ghcr.io/blockscout/frontend:latest
    restart: unless-stopped
    depends_on: [backend]
    environment:
      NEXT_PUBLIC_API_HOST: scan.blockid.au
      NEXT_PUBLIC_API_PROTOCOL: https
      NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL: wss
      NEXT_PUBLIC_API_BASE_PATH: /
      NEXT_PUBLIC_APP_HOST: scan.blockid.au
      NEXT_PUBLIC_APP_PROTOCOL: https
      NEXT_PUBLIC_NETWORK_NAME: BlockID Chain
      NEXT_PUBLIC_NETWORK_SHORT_NAME: BlockID
      NEXT_PUBLIC_NETWORK_ID: "262626"
      NEXT_PUBLIC_NETWORK_RPC_URL: https://eth.blockid.au/rpc
      NEXT_PUBLIC_NETWORK_CURRENCY_NAME: BlockID
      NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: BLKD
      NEXT_PUBLIC_NETWORK_CURRENCY_DECIMALS: "18"
      NEXT_PUBLIC_IS_TESTNET: "true"
      NEXT_PUBLIC_HOMEPAGE_CHARTS: "['daily_txs']"
      NEXT_PUBLIC_AD_BANNER_PROVIDER: none
      NEXT_PUBLIC_AD_TEXT_PROVIDER: none
    ports: ["127.0.0.1:8201:3000"]

networks:
  chain:
    name: blockid-app_default
    external: true
