# hr.blockid.au -> BlockID HR (founding-team reports). Same SPA build as eth.blockid.au; the app switches on the host.
server {
    server_name hr.blockid.au;

    access_log /var/log/nginx/hr.blockid.au.access.log;
    error_log  /var/log/nginx/hr.blockid.au.error.log;

    client_max_body_size 10m;
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    include snippets/blockid-security-headers.conf;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_read_timeout 300s;
    }
    location = /rpc {
        proxy_pass http://127.0.0.1:8080/v1/rpc;
        client_max_body_size 256k;
    }

    root /home/dovanlong/blockid-eth-platform/web/dist;
    index index.html;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/blockid-security-headers.conf;
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include snippets/blockid-security-headers.conf;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hr.blockid.au/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hr.blockid.au/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = hr.blockid.au) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name hr.blockid.au;
    return 404; # managed by Certbot


}