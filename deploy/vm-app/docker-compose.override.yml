# Single VM (no Caddy): nginx on the host owns 80/443 and reverse-proxies to these localhost ports.
services:
  web:
    ports: ["127.0.0.1:8081:80"]
  agents-api:
    ports: ["127.0.0.1:8080:8080"]
  evmd:
    ports: !override
      - "127.0.0.1:8545:8545"
      - "127.0.0.1:8546:8546"
      - "127.0.0.1:1317:1317"
      - "127.0.0.1:26657:26657"
  explorer:
    ports: ["127.0.0.1:8082:80"]
