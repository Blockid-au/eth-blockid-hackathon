# Single VM (no Caddy): nginx on the host owns 80/443 and reverse-proxies to these localhost ports.
services:
  web:
    ports: ["127.0.0.1:8081:80"]
  agents-api:
    ports: ["127.0.0.1:8080:8080"]
  evmd:
    ports: !override
      - "127.0.0.1:8545:8545"
      - "127.0.0.1:8546:8546"
      - "127.0.0.1:1317:1317"
      - "127.0.0.1:26657:26657"
  explorer:
    ports: ["127.0.0.1:8082:80"]
  agents-worker:
    # Two workers so one long valuation does not hold up every other user's run (usage caps are open, docs/GATES.md).
    # Valuation / HR claims use FOR UPDATE SKIP LOCKED; the AI gateway's concurrency slots are per process, so the
    # scarce Claude bridge gets 1 slot per worker (2 in total, as before).
    deploy:
      replicas: 2
    environment:
      AI_CONCURRENCY_CLAUDE_BRIDGE: "1"
