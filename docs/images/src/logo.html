<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  html, body { width: 1024px; height: 1024px; margin: 0; padding: 0; background: #FFFFFF; }
  body { display: grid; place-items: center; }
  .logo-wrap { display: flex; align-items: center; justify-content: center; gap: 48px; }
  .emblem { width: 230px; height: 230px; }
  .text-box { display: flex; flex-direction: column; justify-content: center; }
  .title { font-family: "Be Vietnam Pro", system-ui, sans-serif; font-weight: 800; font-size: 106px; line-height: 0.95; letter-spacing: -0.035em; color: #002B7F; margin: 0; }
  .tld { color: #0070F3; font-weight: 700; }
  .slogan { font-family: "Be Vietnam Pro", system-ui, sans-serif; font-weight: 600; font-size: 32px; color: #002B7F; letter-spacing: -0.01em; margin-top: 14px; }
</style>
</head>
<body>
<div class="logo-wrap">
  <svg class="emblem" viewBox="0 0 240 240" fill="none">
    <defs>
      <linearGradient id="starGlow" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00A3FF" />
        <stop offset="45%" stop-color="#0080FF" />
        <stop offset="100%" stop-color="#0040D0" />
      </linearGradient>
    </defs>
    <!-- Octagon outer frame -->
    <polygon points="76,16 164,16 224,76 224,164 164,224 76,224 16,164 16,76"
             stroke="#002B7F" stroke-width="15" stroke-linejoin="round" fill="none" />
    <!-- Luminous 4-point star astroid -->
    <path d="M 120,48
             C 120,90 150,120 192,120
             C 150,120 120,150 120,192
             C 120,150 90,120 48,120
             C 90,120 120,90 120,48 Z"
          stroke="url(#starGlow)" stroke-width="14" stroke-linejoin="round" fill="none" />
  </svg>
  <div class="text-box">
    <h1 class="title">BlockID<span class="tld">.au</span></h1>
    <div class="slogan">Valuation. Ownership. Growth.</div>
  </div>
</div>
</body>
</html>
