<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
html,body{width:1024px;height:1024px;padding:0}
body{display:grid;place-items:center;background:radial-gradient(700px 700px at 75% 15%,#14453a 0%,transparent 60%),radial-gradient(600px 600px at 15% 95%,#3a2c10 0%,transparent 60%),#0A1312}
</style></head><body>
<svg width="760" height="760" viewBox="0 0 760 760">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26A887"/><stop offset="1" stop-color="#0E5A49"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2CB75"/><stop offset="1" stop-color="#C2841A"/></linearGradient>
</defs>
<!-- passport booklet -->
<rect x="150" y="70" width="460" height="620" rx="46" fill="url(#g)"/>
<rect x="150" y="70" width="46" height="620" rx="23" fill="#0B3F33" opacity=".55"/>
<rect x="186" y="104" width="390" height="552" rx="30" fill="none" stroke="#7FD9C0" stroke-opacity=".35" stroke-width="3"/>
<!-- globe / chain emblem: hexagon of blocks -->
<g transform="translate(380,330)">
<circle r="128" fill="none" stroke="url(#gold)" stroke-width="10"/>
<polygon points="0,-86 74,-43 74,43 0,86 -74,43 -74,-43" fill="none" stroke="#E3EDEB" stroke-width="10" stroke-linejoin="round"/>
<path d="M0,-86 L0,0 M74,43 L0,0 M-74,43 L0,0" stroke="#E3EDEB" stroke-width="10" stroke-linecap="round"/>
<circle r="16" fill="url(#gold)"/>
</g>
<text x="380" y="535" text-anchor="middle" font-family="Be Vietnam Pro" font-weight="800" font-size="46" fill="#E3EDEB" letter-spacing="2">BLOCKID</text>
<text x="380" y="590" text-anchor="middle" font-family="JetBrains Mono" font-weight="500" font-size="25" fill="#F2CB75" letter-spacing="7">STARTUP PASSPORT</text>
<!-- approval stamp -->
<g transform="translate(600,150) rotate(-14)">
<circle r="92" fill="#0A1312" stroke="url(#gold)" stroke-width="9"/>
<circle r="72" fill="none" stroke="#F2CB75" stroke-width="3" stroke-dasharray="6 7"/>
<path d="M-36,2 L-10,28 L40,-26" fill="none" stroke="#F2CB75" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
</body></html>
