[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "blockid-agents"
version = "0.1.0"
description = "BlockID / eth.blockid.au agent platform: SVI valuation, share issuance, dividends — human-gated"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "httpx>=0.27",
  "openai>=1.50",
  "pycryptodome>=3.20",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "google-auth>=2.30",
  "requests>=2.32",
  "psycopg-pool>=3.2",
  "web3>=7",
  "eth-account>=0.13",
  "eth-utils>=4",
  "bcrypt>=4",
  "hexbytes>=1",
  # valuation v5 projection uploads (studio/projections.py): read-only xlsx parsing; defusedxml makes openpyxl
  # refuse XML entity attacks
  "openpyxl>=3.1",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "numpy-financial>=1.0"]  # numpy-financial: DCF test oracle only

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blockid_agents = ["studio/*.sql", "market_data/*.json", "agents/data/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
